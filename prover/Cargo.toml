[package]
name = "zktguard-prover"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zkTGuard reference prover (v0.1 synthetic against the placeholder VK)."
publish = false

[lib]
name = "zktguard_prover"
path = "src/lib.rs"

[[bin]]
name = "zktguard-prover"
path = "src/bin/zktguard_prover.rs"

[dependencies]
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
ark-bls12-381 = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
