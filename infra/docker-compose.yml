# Local-dev convenience for zkTGuard v0.2.
#
# Runs the three off-chain services side-by-side on the host network:
#   - zktguard-stub          deterministic Telegram-shaped upstream
#   - zktguard-attestor      Go proxy attestor with EdDSA-BabyJubjub
#   - zktguard-prover-server Node HTTP wrapper around snarkjs
#
# This file does NOT include any hosted target. zkTGuard is a research
# artifact — no cloud, no managed service, no operated infrastructure.
# The compose file exists so contributors can stand the full stack up
# locally with `docker compose up`.
#
# Bind mounts keep secrets and the proving key OUT of the image:
#   - attestor key      ../attestor/keys/attestor.hex  (mode 600, gitignored)
#   - proving key       ../circuits/build/account_age_pkey.zkey
#                       (not in git — run `bash circuits/scripts/fetch_pkey.sh`
#                       once before `docker compose up`)
#   - circuit wasm      ../circuits/build/circuit_js/circuit.wasm
#   - verification key  ../circuits/account_age/verification_key.json

services:
  stub:
    image: golang:1.22-alpine
    working_dir: /work
    volumes:
      - ../attestor:/work:ro
      - stub-certs:/certs:rw
    # v0.2 Phase B: the stub terminates TLS 1.3 — the attestor refuses
    # plaintext upstreams. The self-signed cert lives on a volume
    # because the repo mount is read-only.
    command: >
      sh -c "
      apk add --no-cache openssl bash >/dev/null &&
      CERT_DIR=/certs bash scripts/gen_stub_cert.sh &&
      go run ./cmd/zktguard-stub --addr 0.0.0.0:7676 --cert /certs/stub.crt --key /certs/stub.key
      "
    ports:
      - "7676:7676"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://127.0.0.1:7676/account"]
      interval: 5s
      timeout: 2s
      retries: 10

  attestor:
    image: golang:1.22-alpine
    working_dir: /work
    volumes:
      - ../attestor:/work:ro
      - attestor-keys:/keys:rw
    # The key-gen script uses bash + xxd; golang:1.22-alpine has
    # neither. Inline a busybox-only equivalent that writes 32 random
    # bytes as 64 hex chars (matching gen_attestor_key.sh's output).
    command: >
      sh -c "
      if [ ! -f /keys/attestor.hex ]; then
        mkdir -p /keys &&
        od -An -vtx1 -N 32 /dev/urandom | tr -dc 'a-f0-9' > /keys/attestor.hex &&
        chmod 0600 /keys/attestor.hex;
      fi &&
      go run ./cmd/zktguard-attestor --addr 0.0.0.0:7677 --upstream https://stub:7676 --insecure-skip-verify --key /keys/attestor.hex
      "
    depends_on:
      stub:
        condition: service_healthy
    ports:
      - "7677:7677"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7677/health"]
      interval: 5s
      timeout: 2s
      # `go run` cold-compiles on first start (~30-60s on a clean
      # alpine), so don't count healthcheck failures during that
      # window against the container.
      retries: 24
      start_period: 60s

  prover-server:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - ..:/repo:ro
      - prover-node-modules:/app/node_modules
    environment:
      ADDR: "0.0.0.0"
      PORT: "7679"
      WASM_PATH: "/repo/circuits/build/circuit_js/circuit.wasm"
      PKEY_PATH: "/repo/circuits/build/account_age_pkey.zkey"
    # The repo is mounted :ro, so pnpm cannot write its temp files
    # anywhere inside /repo. Copy the server source to a writable
    # /app on container start, then install + run there. wasm/zkey
    # paths stay pointed at /repo since those are read-only assets.
    command: >
      sh -c "
      cp -r /repo/prover/server/. /app/ &&
      cd /app &&
      corepack enable && corepack prepare pnpm@9 --activate &&
      pnpm install --ignore-workspace &&
      pnpm start
      "
    ports:
      - "7679:7679"
    depends_on:
      attestor:
        condition: service_healthy
    healthcheck:
      # wget --spider issues HEAD only; the prover handler answers GET
      # /health. Use wget -O - to force GET (discard body).
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7679/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      # pnpm install --prod cold-start can take ~60s on a clean
      # volume, plus snarkjs zkey load on first /prove; give 5 min.
      retries: 60
      start_period: 60s

volumes:
  attestor-keys:
    driver: local
  stub-certs:
    driver: local
  prover-node-modules:
    driver: local
