# Playwright end-to-end suite against the live TON testnet.
#
# This workflow is intentionally NOT triggered on pull requests:
#   - testnet RPC is flaky and rate-limited;
#   - each scenario broadcasts real testnet TON, so the wallet would
#     drain quickly under a heavy PR cadence;
#   - the scenarios can collide on nullifiers if multiple runs of the
#     same spec interleave.
#
# It runs on pushes to main, on `v*` tag pushes (release gate), and
# on manual dispatch.
#
# The `WALLET_STUB_MNEMONIC` secret is configured under
# Settings → Environments → test. The `environment: test` line on the
# job is mandatory: without it, the secret evaluates to an empty
# string and the suite silently skips.
name: e2e-testnet

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  e2e-testnet:
    name: Playwright (testnet)
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    env:
      WALLET_STUB_MNEMONIC: ${{ secrets.WALLET_STUB_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
      # Throttle tuning for the suite. The free-tier toncenter
      # endpoint rate-limits aggressively (~1 RPS) and returns 429/
      # 5xx waves once exceeded. Pace below 0.5 RPS with 5 retries
      # so transient 5xx survives without consuming a spec's budget.
      # If TONCENTER_API_KEY is set, paced calls stay well under any
      # paid-tier cap; if not, the headroom prevents lockouts.
      RATE_DELAY_MS: "3000"
      # RETRY_BACKOFF_MS=5000 with MAX_RETRIES=5 gives a worst-case
      # single-call cost of 5+10+20+40+80=155 s, which blows past
      # expired-proof's 120 s window before a single poll completes.
      # 2000 ms base with 5 retries = 2+4+8+16+32=62 s max — fits
      # any spec budget while still surviving multi-minute outages.
      RETRY_BACKOFF_MS: "2000"
      MAX_RETRIES: "5"
    steps:
      - uses: actions/checkout@v4

      # Defensive guard. The `environment: test` line above should
      # always inject the secret; this prints a clear failure mode
      # if a future repo-admin misconfiguration drops it.
      - name: Verify wallet secret is available
        run: |
          if [ -z "${WALLET_STUB_MNEMONIC}" ]; then
            echo "::error::WALLET_STUB_MNEMONIC is empty; check the test environment configuration."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build SDK + Mini App
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The Groth16 proving key (~169 MB) exceeds GitHub's in-repo
      # limit and ships as a release asset; the compose prover mounts
      # it from circuits/build/. SHA-256 pinned in the script.
      - name: Fetch proving key
        run: bash circuits/scripts/fetch_pkey.sh

      - name: Bring up off-chain stack
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Dump compose logs (always)
        if: always()
        run: docker compose -f infra/docker-compose.yml logs --tail=200 --timestamps || true

      - name: Verify off-chain endpoints are reachable from the host
        run: |
          set -e
          # The stub speaks TLS 1.3 with a self-signed cert (Phase B),
          # hence https + -k for that probe only.
          for url in \
            https://127.0.0.1:7676/account \
            http://127.0.0.1:7677/health \
            http://127.0.0.1:7677/pubkey \
            http://127.0.0.1:7679/health; do
            for i in $(seq 1 30); do
              if curl -fsk "$url" >/dev/null; then
                echo "ok: $url"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "::error::endpoint never responded: $url"
                docker compose -f infra/docker-compose.yml logs --tail=200
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run Playwright suite
        run: pnpm --filter @zktguard/miniapp test:e2e

      - name: Dump verifier + stub-wallet tx state (diagnostic)
        if: always()
        run: node miniapp/e2e/scripts/dump-tx-state.mjs || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down off-chain stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
