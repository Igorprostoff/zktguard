name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build artefacts + draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build SDK + contracts + docs
        run: |
          pnpm --filter @zktguard/sdk build
          (cd contracts && pnpm exec blueprint build --all)
          pnpm --filter @zktguard/docs build

      - name: Install TeX Live for paper PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science lmodern
        continue-on-error: true

      - name: Build paper PDF
        working-directory: paper
        run: make
        continue-on-error: true

      - name: Collect release artefacts
        run: |
          mkdir -p release
          cp circuits/account_age/verification_key.json release/verification_key.json
          cp contracts/build/*.compiled.json release/ || true
          cp REPRODUCE.md release/
          cp CHANGELOG.md release/
          # Paper: ship PDF if the TeX build succeeded; otherwise ship .tex source.
          if [ -f paper/zktguard.pdf ]; then
            cp paper/zktguard.pdf release/
          else
            cp paper/zktguard.tex release/zktguard.tex
            echo "PDF build skipped on CI; LaTeX source attached instead." > release/PAPER_NOTE.md
          fi
          (cd sdk && tar -czf ../release/sdk-dist.tar.gz dist/)
          (cd docs && tar -czf ../release/docs-build.tar.gz build/)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            release/*
          fail_on_unmatched_files: false
          draft: false
