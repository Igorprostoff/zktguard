name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node / pnpm
    runs-on: ubuntu-latest
    env:
      CIRCOM_REV: v2.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # circom v2 (built from source — iden3 do not ship prebuilt
      # binaries). Cached by the pinned CIRCOM_REV so subsequent runs
      # restore in under a second.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache circom
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ env.CIRCOM_REV }}-${{ runner.os }}
      - name: Install circom
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: bash scripts/install_circom.sh

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Reproducibility check
        run: python3 scripts/check_reproduce.py
        continue-on-error: true  # SDK bundle may differ across Node toolchains until pinned

  rust:
    name: Rust (prover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Rust workspace
        id: check
        run: |
          if [ -f prover/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.exists == 'true'
        with:
          components: rustfmt, clippy
      - name: fmt
        if: steps.check.outputs.exists == 'true'
        working-directory: prover
        run: cargo fmt --check
      - name: clippy
        if: steps.check.outputs.exists == 'true'
        working-directory: prover
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        if: steps.check.outputs.exists == 'true'
        working-directory: prover
        run: cargo test --all

  go:
    name: Go (attestor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Go module
        id: check
        run: |
          if [ -f attestor/go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: "1.22"
      - name: fmt
        if: steps.check.outputs.exists == 'true'
        working-directory: attestor
        run: test -z "$(gofmt -l .)"
      - name: vet
        if: steps.check.outputs.exists == 'true'
        working-directory: attestor
        run: go vet ./...
      - name: test
        if: steps.check.outputs.exists == 'true'
        working-directory: attestor
        run: go test ./...
